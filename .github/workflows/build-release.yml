name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and check logic, languages and update validation
        shell: powershell
        run: .\Build.ps1
      - name: Verify release tag matches the binary version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path '.\bin\PCPulseGuard.exe')).FileVersion
          if ($env:GITHUB_REF_NAME -ne ('v' + ([version]$version).ToString(3))) { throw 'Tag and executable versions differ.' }
      - name: Package portable and source archives
        shell: powershell
        run: .\Package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: |
            release/PCPulseGuard-*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-release
          path: release
      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem .\release -File | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "PCPulseGuard $env:GITHUB_REF_NAME" --notes-file .\RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
